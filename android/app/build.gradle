apply plugin: 'com.android.application'

android {
    namespace "com.plkapkhub.store"
    compileSdk 34
    defaultConfig {
        applicationId "com.plkapkhub.store"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             noCompress 'png'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

try {
    def servicesConfigPath = 'google-services.json'
    if (file(servicesConfigPath).exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, skipping plugin application")
}