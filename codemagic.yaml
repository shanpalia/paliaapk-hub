workflows:
  paliaapk-hub-android:
    name: PaliaAPK Hub Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: "com.plkapkhub.store"
      node: 22.11.0

    scripts:
      - name: Install npm dependencies
        script: npm install --no-audit --no-fund

      - name: Build Next.js web app
        script: npm run build

      - name: Sync Capacitor Android project
        script: |
          npx cap sync android
          test -f android/capacitor-cordova-android-plugins/build.gradle || {
            echo "Capacitor sync did not generate capacitor-cordova-android-plugins"
            exit 1
          }
          test -f node_modules/@capacitor/android/capacitor/build.gradle || {
            echo "Capacitor Android Gradle project is missing"
            exit 1
          }
          test -f node_modules/@capacitor/status-bar/android/build.gradle || {
            echo "Capacitor Status Bar Gradle project is missing"
            exit 1
          }

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build signed Android APK
        script: |
          cd android
          # Use Codemagic's installed Gradle so the build does not depend on a checked-in wrapper JAR.
          gradle --version
          gradle clean
          gradle assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/release/output-metadata.json
